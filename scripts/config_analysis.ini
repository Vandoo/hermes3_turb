[h2time]
dir_1    = 10
dir_2    = 18
pout_opt = sum_plt
jump_old = True

[inspect]
prepath  = ./10/
opt_plt  = check_source
#opt_plt  = inspect_quick
#opt_plt  = extreme_values
# opt_plt = 'check_source', 'inspect_quick', 'flux', 'extreme_values'

[debug]
prepath  = ./1/
#opt_plt  = field_aligned_var
#opt_plt  = time_var
#opt_plt = inventory_time

[turbulence]
data_root    = ./
dir_start    = 14
dir_stop     = 32
fields       = Ne, Pe, Vort
location     = omp_sep
sat_window   = 0.2        ; the LAST this-fraction of the run = saturated window (0.2 = last 20%)
t_stride     = 1          ; subsample time every Nth frame on load (>1 speeds up long runs)
bg_drift_max = 0.10       ; |background drift| over sat window above this → draining/filling (blocks SATURATED)
use_cache    = True       ; cache the (t,x) OMP-plane reductions to ./cache; reruns to tweak sat_fraction/thresholds are instant
logy         = True
save_png     = false #turbulence_monitor.png   ; filename, or false to only show (no save)
